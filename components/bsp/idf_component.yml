# Managed-component dependencies for the board-support layer.
# LVGL is deliberately absent: chaosOS draws raw pixels into one framebuffer
# and pushes it with esp_lcd, so no display toolkit is needed.
dependencies:
  idf: ">=5.2"
  # QSPI AMOLED panel driver. The SH8601 driver also drives the CO5300
  # controller on this board via a custom init-command list (bsp_display.c).
  espressif/esp_lcd_sh8601: "^1"
  # NOTE: no touch component. This board uses a CST9217, which has no
  # esp_lcd_touch driver in the registry, so bsp_touch.c talks to it directly.
